{% extends 'base.html' %}{% block content %}<article class="panel"><p class="tag">교육용 상품</p><h1>{{ product.name }}</h1><p>{{ product.description }}</p><h2>{{ '{:,.0f}'.format(product.price) }}원</h2><p>재고 {{ product.stock }}개</p>
{% if g.user %}<form action="{{ url_for('orders.create') }}" method="post"><input type="hidden" name="product_id" value="{{ product.id }}"><label for="quantity">주문 수량</label><input id="quantity" name="quantity" type="number" min="1" max="100" value="1" required><button>더미 주문 생성</button></form>{% else %}<p>주문하려면 <a href="{{ url_for('auth.login') }}">로그인</a>하세요.</p>{% endif %}
<p><a href="{{ url_for('reviews.index', product_id=product.id) }}">후기 보기 및 작성 →</a></p></article>{% endblock %}
