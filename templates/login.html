{% extends 'base.html' %}{% block content %}<section class="panel narrow"><h1>로그인</h1><p>README의 교육용 더미 계정을 사용하세요.</p>{% if error %}<p role="alert" class="error">{{ error }}</p>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="username">사용자 이름</label><input id="username" name="username" maxlength="80" autocomplete="username" required><label for="password">비밀번호</label><input id="password" name="password" type="password" maxlength="256" autocomplete="current-password" required><button>로그인</button></form></section>{% endblock %}
