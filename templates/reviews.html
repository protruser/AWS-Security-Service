{% extends 'base.html' %}{% block content %}<h1>{{ product.name }} 후기</h1>{% for review in reviews %}<article class="card"><strong>{{ review.user.username }}</strong><p class="review">{% include review_partial %}</p></article>{% else %}<p>아직 후기가 없습니다.</p>{% endfor %}
{% if g.user %}<form class="panel" method="post"><label for="content">후기 (최대 2,000자)</label><textarea id="content" name="content" maxlength="2000" rows="5" required></textarea><button>후기 등록</button></form>{% else %}<p>후기를 작성하려면 로그인하세요.</p>{% endif %}{% endblock %}
